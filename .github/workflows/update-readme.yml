name: 自动更新排行榜 README

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00（北京时间 10:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: 拉取最新排行榜数据
        run: |
          echo "### ☁️ 云端大模型 TOP 5" > /tmp/ranking_data.md
          curl -sL "https://www.aibunkhouse.com/api/rankings-v2/llm_cloud?limit=5" --max-time 10 | jq -r '.items[] | "| \(.rank) | \(.name) | \(.company) | \(.vote_count)票 |"' >> /tmp/ranking_data.md

          echo -e "\n### 🏠 本地模型 TOP 3" >> /tmp/ranking_data.md
          curl -sL "https://www.aibunkhouse.com/api/rankings-v2/llm_local?limit=3" --max-time 10 | jq -r '.items[] | "| \(.rank) | \(.name) | \(.company) | \(.vote_count)票 |"' >> /tmp/ranking_data.md

          echo -e "\n### 🤖 AI Agent TOP 3" >> /tmp/ranking_data.md
          curl -sL "https://www.aibunkhouse.com/api/rankings-v2/agent?limit=3" --max-time 10 | jq -r '.items[] | "| \(.rank) | \(.name) | \(.company) | \(.vote_count)票 |"' >> /tmp/ranking_data.md

      - name: 更新 README
        run: |
          HEAD=$(grep -n "^## 云端" README.md | head -1 | cut -d: -f1)
          DATA=$(cat /tmp/ranking_data.md)
          if [ -n "$HEAD" ]; then
            head -n $((HEAD-1)) README.md > /tmp/readme_new.md
            cat /tmp/ranking_data.md >> /tmp/readme_new.md
            tail -n +$((HEAD+1)) README.md | sed -n '/^---/,$p' >> /tmp/readme_new.md
            cp /tmp/readme_new.md README.md
            echo "README 已更新"
          else
            echo "未找到 ## 云端 标记，跳过"
          fi

      - name: 提交修改
        run: |
          git config user.name "aihouse-bot"
          git config user.email "bot@aibunkhouse.com"
          if ! git diff --quiet; then
            git add README.md
            git commit -m "📊 自动更新排行榜数据 $(date +%Y-%m-%d)"
            git push
            echo "✅ 已推送"
          else
            echo "无变化，跳过提交"
          fi
